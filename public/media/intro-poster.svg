<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" role="img" aria-label="AiTroniXus intelligence core">
  <defs>
    <radialGradient id="core" cx="50%" cy="46%" r="42%">
      <stop offset="0%" stop-color="#50e6ff" stop-opacity="0.42"/>
      <stop offset="45%" stop-color="#0078d4" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#030507" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset="55%" stop-color="#030507" stop-opacity="0"/>
      <stop offset="100%" stop-color="#030507" stop-opacity="0.95"/>
    </radialGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#071523"/>
      <stop offset="100%" stop-color="#030507"/>
    </linearGradient>
    <pattern id="trace" width="120" height="120" patternUnits="userSpaceOnUse">
