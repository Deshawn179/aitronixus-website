      <circle cx="76" cy="56" r="1.8" fill="#366bff" fill-opacity="0.4"/>
    </pattern>
  </defs>

  <rect width="1920" height="1080" fill="url(#floor)"/>
  <rect width="1920" height="1080" fill="url(#trace)"/>
  <rect width="1920" height="1080" fill="url(#core)"/>

  <!-- processor die -->
  <g transform="translate(960 500)">
    <rect x="-215" y="-150" width="430" height="300" rx="18" fill="#050b12" fill-opacity="0.9" stroke="#50e6ff" stroke-opacity="0.45" stroke-width="2"/>
    <rect x="-160" y="-108" width="320" height="216" rx="8" fill="#030507" fill-opacity="0.85" stroke="#50e6ff" stroke-opacity="0.22" stroke-width="1.4"/>
    <g stroke="#50e6ff" stroke-opacity="0.35" stroke-width="2" stroke-linecap="round">
      <path d="M-215 -70h-70M-215 0h-70M-215 70h-70M215 -70h70M215 0h70M215 70h70"/>
      <path d="M-90 -150v-64M0 -150v-64M90 -150v-64M-90 150v64M0 150v64M90 150v64"/>
    </g>
    <g fill="#50e6ff">
      <circle cx="-120" cy="96" r="4" fill-opacity="0.9"/>
      <circle cx="-80" cy="96" r="4" fill-opacity="0.6"/>
      <circle cx="-40" cy="96" r="4" fill-opacity="0.85"/>
      <circle cx="0" cy="96" r="4" fill-opacity="0.5"/>
      <circle cx="40" cy="96" r="4" fill-opacity="0.8"/>
    </g>
